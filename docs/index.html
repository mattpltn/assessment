<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weighted Scorecard Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #5b8def;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #e1e4e9;
      --text: #1b1f27;
      --muted: #666d7a;
      --accent: #3461c1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.lede { color: var(--muted); margin-top: 0; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  input[type="file"] { color: var(--text); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  code { background: var(--border); padding: 1px 5px; border-radius: 4px; }
  .error { color: #e5484d; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Weighted Scorecard Demo</h1>
  <p class="lede">Upload a CSV of item answers (columns <code>item_id, Q01..Q69</code>) and get Score&nbsp;A, Score&nbsp;B, and Outcome&nbsp;C for every row.</p>

  <div class="panel">
    <input type="file" id="file-input" accept=".csv" />
    <button class="secondary" id="sample-btn" type="button">Try sample data</button>
    <a href="sample.csv" download style="margin-left: 8px; color: var(--muted); font-size: 0.85rem;">download sample.csv</a>
  </div>

  <div class="panel" id="results-panel" style="display:none;">
    <table id="results-table">
      <thead>
        <tr><th>item_id</th><th>Score A</th><th>Score B</th><th>Outcome C</th><th>certainty</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel error" id="error-panel" style="display:none;"></div>
</main>

<script src="scoring.js"></script>
<script>
let model = null;

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",");
  return lines.slice(1).map((line) => {
    const cells = line.split(",");
    const row = {};
    header.forEach((h, i) => (row[h] = cells[i] ?? ""));
    return row;
  });
}

function showError(message) {
  const panel = document.getElementById("error-panel");
  panel.style.display = message ? "block" : "none";
  panel.textContent = message || "";
}

function renderResults(itemIds, results) {
  showError("");
  const tbody = document.querySelector("#results-table tbody");
  tbody.innerHTML = "";
  itemIds.forEach((id, i) => {
    const r = results[i];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${id}</td><td>${r.scoreA.toFixed(3)}</td><td>${r.scoreB.toFixed(3)}</td><td>${r.outcomeC}</td><td>${r.certainty.toFixed(3)}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("results-panel").style.display = "block";
}

function runCsv(text) {
  try {
    const rows = parseCsv(text);
    const itemIds = rows.map((r) => r.item_id || "");
    const answerRows = rows.map((r) => {
      const { item_id, ...rest } = r;
      const cleaned = {};
      for (const [k, v] of Object.entries(rest)) if (v !== "") cleaned[k] = v;
      return cleaned;
    });
    const results = Scoring.evaluateBatch(model, answerRows);
    renderResults(itemIds, results);
  } catch (e) {
    showError(String(e.message || e));
  }
}

fetch("model.json")
  .then((r) => r.json())
  .then((raw) => {
    model = Scoring.buildModel(raw);
  })
  .catch((e) => showError("Could not load model.json: " + e));

document.getElementById("file-input").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  file.text().then(runCsv);
});

document.getElementById("sample-btn").addEventListener("click", () => {
  fetch("sample.csv")
    .then((r) => r.text())
    .then(runCsv)
    .catch((e) => showError("Could not load sample.csv: " + e));
});
</script>
</body>
</html>
